<script>
'use strict';
const DATA=JSON.parse(document.getElementById('math-content').textContent);
const KEY='miguel-matematica-v1', main=document.getElementById('main');
const byId=Object.fromEntries(DATA.questions.map(q=>[q.id,q]));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let state={version:1,active:null,profiles:[]},storageOK=true;
const object=x=>x!==null&&typeof x==='object'&&!Array.isArray(x);
const strings=x=>Array.isArray(x)&&x.every(v=>typeof v==='string');
function grade(q,values){
 if(!strings(values))return false;
 if(q.type==='choice')return values.length===1&&values[0]===String(q.correct);
 if(values.length!==q.labels.length||!values.every(v=>/^\d+$/.test(v.trim())&&Number.isSafeInteger(Number(v))))return false;
 const nums=values.map(Number);
 if(q.type==='create')return nums[0]>80&&nums[0]===6*nums[1];
 return nums.every((n,i)=>n===q.answers[i]);
}
function validState(s){
 if(!object(s)||s.version!==1||!Array.isArray(s.profiles)||!(s.active===null||typeof s.active==='string'))return false;
 const seen=new Set(),names=new Set();
 for(const p of s.profiles){
  if(!object(p)||typeof p.id!=='string'||seen.has(p.id)||typeof p.name!=='string'||!p.name.trim()||p.name.length>24||names.has(p.name.toLocaleLowerCase('pt-BR'))||!object(p.answers)||!strings(p.cross)||p.cross.length!==9||!p.cross.every(v=>/^\d?$/.test(v))||typeof p.story!=='string')return false;
  seen.add(p.id);names.add(p.name.toLocaleLowerCase('pt-BR'));
  for(const [id,a]of Object.entries(p.answers))if(!byId[id]||!object(a)||typeof a.mastered!=='boolean'||typeof a.lastCorrect!=='boolean'||typeof a.reason!=='string'||!strings(a.values)||grade(byId[id],a.values)!==a.lastCorrect)return false;
  if(p.session!==null){const t=p.session;
   if(!object(t)||!strings(t.ids)||!t.ids.length||new Set(t.ids).size!==t.ids.length||!t.ids.every(id=>byId[id])||!Number.isInteger(t.index)||t.index<0||t.index>t.ids.length||!strings(t.values)||typeof t.reason!=='string'||typeof t.checked!=='boolean'||typeof t.correct!=='boolean'||!Array.isArray(t.results)||t.results.some(v=>typeof v!=='boolean')||t.results.length!==t.index+(t.checked?1:0)||typeof t.title!=='string')return false;
   if(t.index===t.ids.length&&t.checked)return false;
   if(t.checked&&(grade(byId[t.ids[t.index]],t.values)!==t.correct||t.results.at(-1)!==t.correct))return false;
  }
 }
 return s.active===null||seen.has(s.active);
}
function warn(message){document.getElementById('notice').textContent=message}
try{const raw=localStorage.getItem(KEY);if(raw!==null){const candidate=JSON.parse(raw);if(!validState(candidate))throw new Error('invalid');state=candidate}}
catch{storageOK=false;warn('Os dados salvos não puderam ser lidos. Você pode jogar, mas esta sessão não será salva. Os dados anteriores foram preservados.')}
function save(){if(storageOK)try{localStorage.setItem(KEY,JSON.stringify(state))}catch{storageOK=false;warn('O navegador não permitiu salvar. Você pode continuar jogando, mas o avanço desta sessão ficará só até fechar a página.')}}
function player(){return state.profiles.find(p=>p.id===state.active)}
function stars(p=player()){return Object.values(p.answers).filter(a=>a.mastered).length}
function shell(html){main.innerHTML=html;updateHeader();main.focus();window.scrollTo(0,0)}
function updateHeader(){const p=player(),s=p?stars(p):0;document.getElementById('profile').textContent=p?`${p.name} · ★ ${s} ${s===1?'estrela':'estrelas'}`:'';document.getElementById('switch').hidden=!p}
function feedback(text,error=false){const e=document.getElementById('feedback');e.className='feedback'+(error?' error':'');e.textContent=text}
function button(text,fn,cls=''){return `<button ${cls?`class="${cls}"`:''} onclick="${fn}">${text}</button>`}
function back(){return button('← Voltar ao mapa','map()','back')}
function login(){
 shell(`<section class="panel login"><div class="eyebrow">Uma aventura com números</div><h1>Missão Divisão <span aria-hidden="true">🚀</span></h1><p>Um problema por vez. Você pensa, experimenta e descobre os segredos da divisão!</p><form id="login" class="stack"><label>Seu nome ou apelido<input id="name" maxlength="24" required autocomplete="nickname" placeholder="Como podemos chamar você?"></label><button>Vamos nessa!</button></form><div id="feedback" role="status"></div><p class="note">Sem cadastro. Seu nome e seu progresso ficam neste navegador.</p>${state.profiles.length?'<p>Já jogou por aqui?</p><div class="saved-names">'+state.profiles.map((p,i)=>button(esc(p.name),`selectPlayer(${i})`,'secondary')).join('')+'</div>':''}</section>`);
 document.getElementById('login').onsubmit=e=>{e.preventDefault();const name=document.getElementById('name').value.trim();if(!name){feedback('Digite seu nome ou apelido para começar.',true);return}let p=state.profiles.find(p=>p.name.toLocaleLowerCase('pt-BR')===name.toLocaleLowerCase('pt-BR'));if(!p){p={id:crypto.randomUUID(),name,answers:{},session:null,cross:Array(9).fill(''),story:''};state.profiles.push(p)}state.active=p.id;save();map()};
}
function selectPlayer(i){state.active=state.profiles[i].id;save();map()}
document.getElementById('switch').onclick=()=>{state.active=null;save();login()};
const art=`<svg class="hero-art" viewBox="0 0 320 250" aria-hidden="true"><ellipse cx="163" cy="135" rx="140" ry="107" fill="#efe7d5"/><g transform="rotate(-8 160 130)"><rect x="82" y="40" width="156" height="180" rx="28" fill="#87bda6" stroke="#235f50" stroke-width="3"/><rect x="99" y="58" width="122" height="48" rx="11" fill="#fff8df"/><text x="160" y="93" text-anchor="middle" font-size="30" font-family="sans-serif" fill="#235f50">÷ = ✦</text><rect x="103" y="121" width="31" height="31" rx="8" fill="#fff8df"/><rect x="145" y="121" width="31" height="31" rx="8" fill="#fff8df"/><rect x="187" y="121" width="31" height="31" rx="8" fill="#efb565"/><circle cx="132" cy="176" r="5" fill="#235f50"/><circle cx="188" cy="176" r="5" fill="#235f50"/><path d="M147 186q13 16 27 0" fill="none" stroke="#235f50" stroke-width="4" stroke-linecap="round"/></g><path d="M45 45l6 15 16 2-13 10 4 16-13-9-14 9 4-16-13-10 17-2z" fill="#edb54a"/><circle cx="267" cy="187" r="20" fill="#eabbb4"/><path d="M256 187h22m-11-11v22" stroke="#934d45" stroke-width="3"/></svg>`;
function map(){const p=player();if(!p)return login();const pending=DATA.questions.filter(q=>p.answers[q.id]?.lastCorrect===false);shell(`<section class="hero"><div><div class="eyebrow">Matemática · 3º ano · páginas 230–249</div><h1>Dividir para<br><span style="color:var(--green)">descobrir!</span></h1><p>Oi, ${esc(p.name)}! O robô Quociente precisa da sua ajuda. Vamos repartir ideias e multiplicar descobertas?</p><span class="pill">48 desafios</span><span class="pill">No seu ritmo</span><span class="pill">Sem corrida contra o relógio</span></div>${art}</section><section class="panel welcome"><div><div class="eyebrow">Comece por aqui</div><h2>Revisão de hoje</h2><p>12 desafios para visitar todos os assuntos.<br>Separe papel e lápis. Reserve cerca de 15–20 minutos.</p></div>${button('Começar revisão de hoje',"start('quick')")}</section>${p.session&&p.session.index<p.session.ids.length?`<div class="panel"><strong>Você tem uma rodada em andamento.</strong><p>${esc(p.session.title)} · desafio ${p.session.index+1} de ${p.session.ids.length}</p>${button('Continuar de onde parei','question()')}</div>`:''}${pending.length?`<div class="panel"><strong>Errar deu uma pista do que treinar!</strong><p>Vamos olhar novamente os desafios que merecem atenção.</p>${button(`Rever ${pending.length} desafio${pending.length===1?'':'s'}`,"start('review')",'secondary')}</div>`:''}<div class="section-title"><h2>Seu mapa de descobertas</h2><span class="note">Cada trilha: 8 desafios · cerca de 15–20 min</span></div><div class="grid">${DATA.missions.map(m=>{const count=DATA.questions.filter(q=>q.mission===m.id&&p.answers[q.id]?.mastered).length;return `<article class="tile ${m.color}"><span class="icon" aria-hidden="true">${m.icon}</span><div class="progressline"><span>Trilha ${m.id}</span><span>${count}/8 descobertas</span></div><progress max="8" value="${count}" aria-label="Progresso em ${m.title}"></progress><h3>${m.title}</h3><p>Páginas ${m.pages}</p>${count===8?'<span class="badge">★ Trilha conquistada</span>':''}${button('Treinar '+m.title,`lesson(${m.id})`)}</article>`}).join('')}</div><div class="section-title"><h2>Aprenda experimentando</h2></div><div class="grid tools"><article class="tile"><h3>🧱 Oficina da divisão</h3><p>Veja as trocas de centenas, dezenas e unidades e acompanhe a conta.</p>${button('Abrir oficina da divisão','workshop()')}</article><article class="tile"><h3>🔢 Números cruzados</h3><p>As respostas se encontram! Confira linhas e colunas do mesmo tabuleiro.</p>${button('Jogar números cruzados','crossword()')}</article><article class="tile"><h3>✏️ Agora você é o autor</h3><p>Invente um problema, explique a solução e compare com um exemplo.</p>${button('Criar meu problema','author()')}</article></div>`)}
function lesson(id){const m=DATA.missions.find(m=>m.id===id);shell(`<div class="session">${back()}<section class="panel"><div class="eyebrow">Trilha ${id} · páginas ${m.pages}</div><h1>${m.icon} ${m.title}</h1><p>${m.concept}</p><div class="feedback"><strong>Veja um exemplo</strong><p>${m.example}</p></div><p class="note">Leia, imagine a situação e use papel e lápis. Você pode abrir uma dica durante cada desafio.</p>${button('Iniciar trilha',`start(${id})`)}</section></div>`)}
function start(mode){const p=player();let ids,title;if(mode==='quick'){ids=DATA.quick;title='Revisão de hoje'}else if(mode==='review'){ids=DATA.questions.filter(q=>p.answers[q.id]?.lastCorrect===false).map(q=>q.id);title='Rever e descobrir'}else{ids=DATA.questions.filter(q=>q.mission===mode).map(q=>q.id);title=DATA.missions.find(m=>m.id===mode).title}if(!ids.length)return map();p.session={ids:[...ids],title,index:0,values:[],reason:'',checked:false,correct:false,results:[]};save();question()}
function visual(kind){if(kind==='posts')return `<svg class="chart" viewBox="0 0 370 85" role="img" aria-label="Quatro postes separados por três intervalos iguais"><path d="M30 25h310" stroke="#a5b6a2" stroke-width="3"/><path d="M30 10v40m103-40v40m104-40v40m103-40v40" stroke="#775d38" stroke-width="7"/><text x="185" y="78" text-anchor="middle" fill="#283d3c">1º ───── 2º ───── 3º ───── 4º</text></svg>`;if(kind==='chart')return `<svg class="chart" viewBox="0 0 370 200" role="img" aria-label="Gráfico circular de seis partes iguais: laranja três partes, amarelo duas e verde uma"><path d="M100 100L100 20A80 80 0 1 1 100 180Z" fill="#ec9951" stroke="#fff" stroke-width="2"/><path d="M100 100L100 180A80 80 0 0 1 30.72 60Z" fill="#f0d665" stroke="#fff" stroke-width="2"/><path d="M100 100L30.72 60A80 80 0 0 1 100 20Z" fill="#6baf87" stroke="#fff" stroke-width="2"/><path d="M100 100l69.28-40m-69.28 40l69.28 40m-69.28-40l-69.28 40" stroke="#fff" stroke-width="2"/><g fill="#283d3c" font-size="15"><text x="195" y="60">Laranja: 3 partes</text><text x="195" y="100">Amarelo: 2 partes</text><text x="195" y="122">136 pontos</text><text x="195" y="160">Verde: 1 parte</text></g></svg>`;return ''}
function question(){const t=player().session;if(!t)return map();if(t.index===t.ids.length)return result();const q=byId[t.ids[t.index]];shell(`<div class="session">${back()}<div class="progressline"><span>${esc(t.title)}</span><span>Desafio ${t.index+1} de ${t.ids.length}</span></div><progress max="${t.ids.length}" value="${t.index}" aria-label="Progresso da rodada"></progress><section class="panel"><div class="eyebrow">${DATA.missions[q.mission-1].icon} Pense, resolva, confira · p. ${q.page}</div><h1>${q.title}</h1>${visual(q.visual)}<form id="answer">${q.type==='choice'?`<fieldset><legend>Escolha uma resposta</legend>${q.options.map((o,i)=>`<label class="option"><input type="radio" name="choice" value="${i}" ${t.values[0]===String(i)?'checked':''} ${t.checked?'disabled':''}><span>${o}</span></label>`).join('')}</fieldset>`:`<div class="fields">${q.labels.map((l,i)=>`<label>${l}<input id="value${i}" data-answer inputmode="numeric" autocomplete="off" value="${esc(t.values[i]||'')}" ${t.checked?'disabled':''}></label>`).join('')}</div><p class="note">Escreva só números inteiros, sem ponto de milhar. Exemplo: 1200.</p>`}<details ${t.checked?'':'id="hint"'}><summary>Uma pista para pensar</summary><p>${q.hint}</p></details><label>Como você pensou?<textarea id="reason" maxlength="2000" placeholder="Conte sua ideia ou registre a conta (opcional)." ${t.checked?'disabled':''}>${esc(t.reason)}</textarea></label><p class="note">Seu raciocínio fica guardado para comparar com a explicação. O texto livre não recebe correção automática.</p>${t.checked?'':'<button type="submit">Conferir resposta</button>'}</form><div id="feedback" tabindex="-1" class="feedback${t.checked&&!t.correct?' error':''}" role="status">${t.checked?answerExplanation(q,t.correct):''}</div>${t.checked?`<div class="actions">${button(t.index===t.ids.length-1?'Ver resultado':'Próximo desafio','next()')}</div>`:''}</section></div>`);
 const form=document.getElementById('answer');form.oninput=()=>{if(t.checked)return;t.values=readValues(q);t.reason=document.getElementById('reason').value;save()};form.onsubmit=e=>{e.preventDefault();if(t.checked)return;t.values=readValues(q);t.reason=document.getElementById('reason').value;const required=q.type==='choice'?1:q.labels.length;if(t.values.length!==required||t.values.some(v=>!v.trim())){feedback('Preencha a resposta antes de conferir.',true);return}if(q.type!=='choice'&&!t.values.every(v=>/^\d+$/.test(v.trim())&&Number.isSafeInteger(Number(v)))){feedback('Use apenas números inteiros, sem sinal, letras ou ponto de milhar.',true);return}t.correct=grade(q,t.values);t.checked=true;t.results.push(t.correct);const old=player().answers[q.id];player().answers[q.id]={mastered:!!old?.mastered||t.correct,lastCorrect:t.correct,reason:t.reason,values:[...t.values]};save();question();document.getElementById('feedback').focus();document.getElementById('feedback').scrollIntoView({block:'nearest'})};
}
function readValues(q){return q.type==='choice'?[...document.querySelectorAll('[name=choice]:checked')].map(e=>e.value):[...document.querySelectorAll('[data-answer]')].map(e=>e.value)}
function answerExplanation(q,correct){return `<h2>${correct?'★ Boa descoberta!':'Vamos entender juntos'}</h2><p>${q.explain}</p>${q.type==='create'&&correct?`<p><strong>Sua criação: ${Number(player().session.values[0])} ÷ 6 = ${Number(player().session.values[1])}.</strong> Ela atende às duas condições!</p>`:''}<p class="note" style="margin-top:12px">${correct?'Leia a explicação e compare com seu jeito de pensar.':'Este desafio vai para a sua revisão. Você pode tentar novamente depois de entender a explicação.'}</p>`}
function next(){const t=player().session;if(!t?.checked)return;t.index++;t.values=[];t.reason='';t.checked=false;t.correct=false;save();question()}
function result(){const t=player().session;const right=t.results.filter(Boolean).length;shell(`<div class="session"><section class="panel finish"><div style="font-size:60px" aria-hidden="true">${right===t.ids.length?'🏆':'🌱'}</div><h1>Mais uma descoberta!</h1><p>Você acertou <strong>${right} de ${t.ids.length}</strong> desafios nesta rodada.</p><div class="stats"><div class="stat"><strong>${stars()}</strong>estrelas conquistadas</div><div class="stat"><strong>${t.ids.length-right}</strong>para rever com calma</div></div><p>Explique uma descoberta em voz alta. Depois, faça uma pausa ou volte ao mapa para continuar.</p><p class="note">Cada desafio dá uma estrela na primeira vez em que você acerta. Repetir ajuda a aprender e não duplica estrelas.</p>${button('Voltar ao mapa','map()')}</section></div>`)}
function blocks(n){return `<div class="blocks" aria-hidden="true">${'<span class="block hundred"></span>'.repeat(Math.floor(n/100))}${'<span class="block ten"></span>'.repeat(Math.floor(n%100/10))}${'<span class="block one"></span>'.repeat(n%10)}</div>`}
function workshop(){shell(`<div class="session">${back()}<section class="panel"><div class="eyebrow">Veja o que a conta está fazendo</div><h1>Oficina da divisão 🧱</h1><p>Cada placa vale 100, cada barrinha vale 10 e cada cubinho vale 1. Observe as trocas antes de tentar uma conta no papel.</p><label>Conta para explorar<select id="workshopChoice"><option value="73,3">73 ÷ 3 · com troca e resto</option><option value="69,3">69 ÷ 3 · sem troca</option><option value="744,6">744 ÷ 6 · centenas e dezenas</option><option value="138,3">138 ÷ 3 · começar pelas dezenas</option><option value="390,3">390 ÷ 3 · zero no quociente</option></select></label><div id="workshop" aria-live="polite"></div></section></div>`);document.getElementById('workshopChoice').onchange=drawWorkshop;drawWorkshop()}
function longDivision(n,d){
 const digits=String(n).split('').map(Number),width=digits.length+2,q=Math.floor(n/d);let rem=0,started=false,rows=[String(n).padStart(width)+' │ '+d];
 for(let i=0;i<digits.length;i++){
  const part=rem*10+digits[i],digit=Math.floor(part/d),end=i+3;
  if(digit||started||i===digits.length-1){
   if(started)rows.push(String(part).padStart(end));
   rows.push(('−'+digit*d).padStart(end).padEnd(width)+(started?'':' ├────'));
   rows.push('─'.repeat(String(part).length).padStart(end).padEnd(width)+(started?'':' │ '+q));started=true;
  }
  rem=part%d;
 }
 rows.push(String(rem).padStart(width));return rows.join('\n');
}
function drawWorkshop(){const [n,d]=document.getElementById('workshopChoice').value.split(',').map(Number),q=Math.floor(n/d),r=n%d;let rem=0,lines=[];const digits=String(n).split('').map(Number),units=['unidades','dezenas','centenas'];const amount=(v,p)=>`${v} ${v===1?units[p].slice(0,-1):units[p]}`;digits.forEach((digit,i)=>{const power=digits.length-i-1,part=rem*10+digit,z=Math.floor(part/d),left=part%d;let text=rem?`${rem===1?'A':'As'} ${amount(rem,power+1)} que ${rem===1?'sobrou vira':'sobraram viram'} ${amount(rem*10,power)}. Juntando ${digit}, temos ${amount(part,power)}. `:`Temos ${amount(part,power)}. `;text+=`Dividindo por ${d}, cada grupo recebe ${amount(z,power)}. O resto nesta etapa é ${left}.`;lines.push(text);rem=left});document.getElementById('workshop').innerHTML=`<div class="equation">${n} ÷ ${d} → ${q}, resto ${r}</div><h2>Repartindo em ${d} grupos</h2>${Array.from({length:d},(_,i)=>`<div class="groupbox"><strong>Grupo ${i+1}: ${q}</strong>${blocks(q)}</div>`).join('')}<p><strong>Fora dos grupos: ${r} unidade${r===1?'':'s'}.</strong></p>${blocks(r)}<h2>Entenda as trocas</h2><ol class="steps">${lines.map(l=>`<li>${l}</li>`).join('')}</ol><h2>Registro da conta</h2><pre class="longdiv" aria-label="Conta de ${n} dividido por ${d}, quociente ${q} e resto ${r}">${longDivision(n,d)}</pre><div class="feedback"><strong>Conferência: ${q} × ${d} + ${r} = ${n}.</strong><p>${r===0?'Nada sobrou: a divisão é exata.':`O resto ${r} é menor que ${d}, então não dá para repartir mais uma unidade para cada grupo.`}</p></div>`}
function crossword(){const p=player();shell(`<div class="session">${back()}<section class="panel"><div class="eyebrow">Inspirado na página 248</div><h1>Números cruzados 🔢</h1><p>Resolva as contas. Escreva um algarismo por quadrinho, da esquerda para a direita. As colunas também precisam formar as respostas!</p><div class="clues"><div><h3>Linhas →</h3><p>1. 247 + 591<br>2. 563 − 58<br>3. 2 × 300</p></div><div><h3>Colunas ↓</h3><p>1. 806 + 50<br>2. 900 ÷ 3<br>3. 5 × 170</p></div></div><form id="crossForm"><div class="cross">${p.cross.map((v,i)=>`<input aria-label="Linha ${Math.floor(i/3)+1}, coluna ${i%3+1}" inputmode="numeric" pattern="[0-9]" maxlength="1" required value="${esc(v)}">`).join('')}</div><button>Conferir cruzados</button></form><div id="feedback" role="status"></div><p class="note">Esta oficina é livre: não muda suas estrelas dos desafios.</p></section></div>`);const form=document.getElementById('crossForm');form.oninput=()=>{p.cross=[...form.querySelectorAll('input')].map(i=>i.value.replace(/\D/g,'').slice(0,1));form.querySelectorAll('input').forEach((e,i)=>e.value=p.cross[i]);save()};form.onsubmit=e=>{e.preventDefault();if(p.cross.join('')==='838505600')feedback('Você conferiu as seis contas! Linhas: 838, 505 e 600. Colunas: 856, 300 e 850. Observe o zero de 300: 900 ÷ 3 não é 30.');else feedback('Ainda há um encontro para ajustar. Confira cada linha e depois leia as colunas de cima para baixo. Dica: 900 ÷ 3 = 300, pois 300 × 3 = 900.',true)}}
function author(){shell(`<div class="session">${back()}<section class="panel"><div class="eyebrow">Sua ideia vira um problema</div><h1>Agora você é o autor ✏️</h1><p>Invente uma situação para <strong>35 ÷ 4</strong>. Conte o que será repartido, escreva uma pergunta e explique a resposta com o resto.</p><label>Meu problema e minha solução<textarea id="story" maxlength="3000" placeholder="Era uma vez…">${esc(player().story)}</textarea></label><p class="note">Seu texto é salvo. Esta atividade não recebe correção automática nem estrelas.</p><details><summary>Comparar com um exemplo e conferir meu texto</summary><p>“Quatro amigos vão repartir 35 figurinhas igualmente, sem cortar nenhuma. Quantas cada um recebe e quantas sobram?”</p><p>Cada amigo recebe 8 e sobram 3, pois 4 × 8 + 3 = 35. O resto é menor que 4.</p><p>Meu texto diz qual é o total? Deixa claro que são partes iguais? Pergunta algo que a divisão responde? Minha resposta tem unidade e explica a sobra?</p><p>Seu problema pode ser diferente e também estar correto. Leia para um adulto ou colega e compare as ideias.</p></details></section></div>`);document.getElementById('story').oninput=e=>{player().story=e.target.value;save()}}
if(player()){if(player().session)question();else map()}else login();
</script></body></html>
