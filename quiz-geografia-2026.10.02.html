<script id="geo-app">
'use strict';
const DATA=JSON.parse(document.getElementById('geo-content').textContent);
const QUESTIONS=DATA.missions.flatMap(m=>m.questions);
const KEY='miguel-geografia-v1';
const main=document.getElementById('main');
let storageOK=true,store={version:1,active:null,profiles:[]},toastTimer;
function storageWarning(){storageOK=false;const n=document.getElementById('storage-notice');n.hidden=false;n.textContent='Você pode jogar, mas o progresso desta sessão não ficará salvo. O navegador bloqueou o armazenamento ou os dados antigos não puderam ser lidos.';}
try{const raw=localStorage.getItem(KEY);if(raw){const s=JSON.parse(raw);if(s.version!==1||!Array.isArray(s.profiles)||!s.profiles.every(p=>p&&typeof p.name==='string'&&typeof p.id==='string'&&p.answers&&p.awards&&p.drafts&&p.crossDrafts))throw Error('Dados inválidos');store=s;if(!store.profiles.some(p=>p.id===store.active))store.active=null;}localStorage.setItem(KEY,JSON.stringify(store));}catch{storageWarning();}
function save(){if(storageOK)try{localStorage.setItem(KEY,JSON.stringify(store));}catch{storageWarning();}}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function norm(s){return String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim().toLowerCase().replace(/\s+/g,' ');}
function wordNorm(s){return norm(s).replace(/[^a-z]/g,'').toUpperCase();}
function profile(){return store.profiles.find(p=>p.id===store.active);}
function xp(){return Object.keys(profile()?.awards||{}).length*10;}
function totalDone(){return QUESTIONS.filter(q=>profile().answers[q.id]?.mastered).length;}
function missionDone(i){return DATA.missions[i].questions.every(q=>profile().answers[q.id]?.mastered);}
function pending(){return QUESTIONS.filter(q=>profile().answers[q.id]?.correct===false);}
function shuffled(items){const a=[...items];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function award(id){if(profile().awards[id])return false;profile().awards[id]=true;save();updateHeader();return true;}
function record(id,correct){const prev=profile().answers[id];profile().answers[id]={correct,mastered:correct||!!prev?.mastered};if(correct)award('q:'+id);save();updateHeader();}
function grade(q,value){if(q.type==='multi')return Array.isArray(value)&&new Set(value).size===q.answer.length&&q.answer.every(a=>value.includes(a));if(q.type==='order')return Array.isArray(value)&&value.length===q.answer.length&&q.answer.every((a,i)=>value[i]===a);if(q.type==='fill')return norm(value)===norm(q.answer);return value===q.answer;}
function toast(message){const el=document.getElementById('toast');el.textContent=message;el.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.hidden=true,2600);}
function updateHeader(){const p=profile();document.getElementById('header-actions').innerHTML=p?`<div class="profile"><span id="profile-name" class="profile-name">${esc(p.name)}</span><span class="xp">✦ <span id="xp-total">${xp()}</span> XP</span></div><button class="plain" data-action="switch">Trocar explorador</button><button class="plain" data-action="guide">Guia da família</button>`:'<a class="small" href="index.html">← Todos os quizzes</a>';}
function view(html,focus=true){main.innerHTML=html;updateHeader();if(focus){main.focus({preventScroll:true});window.scrollTo(0,0);}}
function back(){return '<button class="plain back" data-action="home" aria-label="Mapa da expedição">← Mapa da expedição</button>';}

function welcome(){store.active=null;save();view(`<div class="welcome"><div class="hero"><div><span class="eyebrow">Uma aventura pelo mundo de todo dia</span><h1>Quem vem nessa<br><span style="color:var(--purple)">expedição?</span></h1><p>Eu sou a Bússola Bia! Minha agulha aponta para a próxima descoberta. E você, como quer ser chamado?</p><form id="name-form"><label class="label" for="child-name">Seu nome ou apelido</label><div class="welcome-form"><input id="child-name" name="name" type="text" maxlength="24" autocomplete="nickname" required placeholder="Digite aqui"><button class="primary" type="submit">Começar a expedição</button></div><p id="name-error" role="alert" class="small"></p></form><p class="small muted">Seu progresso fica neste navegador. Use um apelido diferente se outra criança tiver o mesmo nome.</p></div>${art()}</div>${store.profiles.length?`<div class="panel"><h2>Já esteve por aqui?</h2><div class="profile-options">${store.profiles.map(p=>`<button data-action="resume-profile" data-id="${esc(p.id)}">Continuar como ${esc(p.name)}</button>`).join('')}</div></div>`:''}<div class="row"><span class="tag green">6 missões</span><span class="tag">72 perguntas com explicação</span><span class="tag gold">Jogos + descobertas</span></div></div>`);}
function enter(name){name=name.trim().normalize('NFC');if(!name||name.length>24){document.getElementById('name-error').textContent='Escreva um nome ou apelido com até 24 caracteres.';return;}let p=store.profiles.find(p=>p.name.trim().toLocaleLowerCase('pt-BR')===name.toLocaleLowerCase('pt-BR'));if(!p){p={id:crypto.randomUUID(),name,answers:{},awards:{},drafts:{},crossDrafts:{},session:null};store.profiles.push(p);}store.active=p.id;save();home();}
function home(){if(!profile())return welcome();const p=profile(),done=totalDone();view(`<div class="hero"><div><span class="eyebrow">Expedição Geografia · Prova de 2/10</span><h1>O mundo está cheio<br>de <span style="color:var(--purple)">porquês!</span></h1><p>Oi, ${esc(p.name)}! Vamos descobrir como o trabalho muda as paisagens e como cuidar do solo e da água?</p><span class="tag green">Uma missão por rodada · cerca de 15–20 min</span></div>${art()}</div><div class="panel"><div class="progress-line"><strong>Seu passaporte de descobertas</strong><span>${done} de 72 questões já acertadas</span></div><div class="track" role="progressbar" aria-label="Questões já acertadas" aria-valuenow="${done}" aria-valuemin="0" aria-valuemax="72"><span style="width:${done/72*100}%"></span></div><p class="small muted" style="margin:10px 0 0">${DATA.missions.filter((_,i)=>missionDone(i)).length} de 6 selos de missão · ${Object.keys(p.awards).filter(k=>k.startsWith('s:')).length} de 18 palavras encontradas · ${Object.keys(p.awards).filter(k=>k.startsWith('c:')).length} de 15 pistas resolvidas</p></div>${p.session&&!p.session.finalized?`<div class="note row between"><div><strong>Uma descoberta ficou esperando você.</strong><br><span class="small">${esc(p.session.title)} · desafio ${p.session.index+1} de ${p.session.ids.length}</span></div><button class="primary" data-action="continue">Continuar rodada</button></div>`:''}<div class="section-head"><h2>Seu mapa de missões</h2><span class="tag">Todas abertas para explorar</span></div><div class="grid">${DATA.missions.map((m,i)=>{const n=m.questions.filter(q=>p.answers[q.id]?.mastered).length;return `<article class="mission" style="--tint:var(--${m.color})"><div class="row between"><span class="icon" aria-hidden="true">${m.icon}</span><span class="tag ${n===12?'green':''}">${n===12?'✓ Selo conquistado':`Missão 0${i+1}`}</span></div><h3>${esc(m.title)}</h3><p>${esc(m.desc)}</p><div class="mission-bottom"><div class="progress-line"><span>${n} de 12 descobertas</span><span>Pág. ${m.pages.split(',')[0]}</span></div><div class="track"><span style="width:${n/12*100}%"></span></div><button data-action="lesson" data-i="${i}" aria-label="Explorar ${esc(m.title)}">Explorar missão →</button></div></article>`}).join('')}</div><div class="section-head"><h2>Outros jeitos de descobrir</h2></div><div class="tools">${[
['search','🔎','Caça-palavras','3 tabuleiros · encontre e entenda'],['cross','🧩','Cruzadinhas','3 jogos · conecte os conceitos'],['review','💡',`Rever dúvidas · ${pending().length}`,'Uma nova chance, com explicação'],['sim-intro','🎒','Simulado','12 questões · correção no final'],['notebook','📓','Caderno de descobertas','Explique com as suas palavras'],['lab','🌧️','Laboratório da chuva','Veja o caminho da água']].map(([a,e,t,d])=>`<button class="tool" data-action="${a}" data-i="0"><span class="tool-icon" aria-hidden="true">${e}</span><span><b>${t}</b><small>${d}</small></span></button>`).join('')}</div><p class="small muted" style="margin-top:22px">XP celebra suas descobertas. Errar não tira pontos: mostra o que vale investigar. Depois da rodada, faça uma pausa!</p>`);}
function lesson(i){const m=DATA.missions[i];view(`<div class="narrow">${back()}<span class="eyebrow">Missão ${i+1} · Páginas ${m.pages}</span><h1 style="margin-top:12px">${m.icon} ${esc(m.title)}</h1><p class="muted">${esc(m.desc)} Primeiro, descubra as ideias. Depois, coloque-as em prática.</p><div class="lesson-grid">${m.facts.map(([t,d])=>`<article class="fact"><h3>${esc(t)}</h3><p>${esc(d)}</p></article>`).join('')}</div><div class="note"><strong>Desafio de explorador</strong><p>${esc(m.reflect)}</p></div>${profile().session&&!profile().session.finalized?'<p class="small muted">Começar estes desafios substitui a rodada em andamento. Seus acertos e pontos continuam guardados.</p>':''}<button class="primary" data-action="start-mission" data-i="${i}">Começar os 12 desafios</button><p class="small muted" style="margin-top:12px">Pode consultar estes conceitos quando precisar. Ler, tentar e explicar fazem parte da aventura.</p></div>`);}
function startSession(ids,title,mode='practice',mission=null){const optionOrders={},values={};for(const id of ids){const q=QUESTIONS.find(q=>q.id===id);if(q.options)optionOrders[id]=shuffled(q.options);if(q.type==='order'){let a=shuffled(q.answer);if(grade(q,a))a=[...a.slice(1),a[0]];values[id]=a;}}profile().session={ids,title,mode,mission,index:0,responses:{},values,optionOrders,finalized:false};save();renderQuestion();}
function current(){const s=profile().session;return {s,q:QUESTIONS.find(q=>q.id===s.ids[s.index])};}
function source(q){return `Base: páginas ${q.pages} do livro.`;}
function answerText(q){return Array.isArray(q.answer)?q.answer.join(q.type==='order'?' → ':'; '):q.answer;}
function diagram(kind){if(kind==='chart')return `<figure class="chart"><figcaption><strong>Quem usa mais água?</strong><br><span class="small">Gráfico histórico da página 103 · fonte do livro: ANA, 2013</span></figcaption>${[['Agricultura e pecuária','82,8',82.8],['Abastecimento humano','10,6',10.6],['Indústria','6,7',6.7]].map(([l,v,n])=>`<div class="bar-row">${l}: <b>${v}%</b><span aria-hidden="true"><i style="width:${n}%"></i></span></div>`).join('')}<p class="small muted" style="margin:0">Valores do livro, não dados atuais. Pequena diferença na soma vem do arredondamento.</p></figure>`;
if(kind==='map')return `<figure style="margin:15px 0"><svg class="diagram" viewBox="0 0 600 265" role="img" aria-label="Mapa fictício visto de cima: rio azul, morro verde, ponte sobre o rio, escola com símbolo de livro e mercado com cesta. A legenda indica livro igual a escola."><rect width="600" height="265" fill="#edf1df"/><path d="M0 139 Q160 86 310 143 T600 133" stroke="#82bfd8" stroke-width="44" fill="none"/><path d="M295 93v100" stroke="#bb8859" stroke-width="33"/><rect x="72" y="30" width="80" height="55" rx="9" fill="#ead095"/><text x="112" y="67" text-anchor="middle" font-size="29">📖</text><rect x="428" y="31" width="87" height="55" rx="9" fill="#d8b9dc"/><text x="472" y="67" text-anchor="middle" font-size="29">🧺</text><ellipse cx="124" cy="203" rx="53" ry="30" fill="#9ebc80"/><text x="124" y="209" text-anchor="middle" font-size="16" fill="#26372e">Morro</text><text x="330" y="184" font-size="15" fill="#333">Ponte</text><text x="456" y="144" font-size="15" fill="#193c55">Rio</text><text x="229" y="238" font-size="16" fill="#333">Legenda: 📖 Escola · 🧺 Mercado</text></svg><figcaption class="small muted">Bairro Curioso: mapa inventado para esta atividade. Cores e tamanhos ilustrativos.</figcaption></figure>`;
return `<figure style="margin:15px 0"><svg class="diagram" viewBox="0 0 620 210" role="img" aria-label="Antes: uma casa e três árvores. Depois: três construções e uma árvore. A rua permaneceu no mesmo lugar."><rect width="620" height="210" fill="#eef0df"/><text x="145" y="29" text-anchor="middle" font-size="18" fill="#333">ANTES</text><text x="465" y="29" text-anchor="middle" font-size="18" fill="#333">DEPOIS</text><path d="M0 176h620" stroke="#aaaba4" stroke-width="28"/><path d="M310 10v187" stroke="#c9c4b5" stroke-width="2" stroke-dasharray="5 5"/><rect x="98" y="114" width="59" height="48" fill="#dfb270"/><path d="M90 115l38-35 38 35" fill="#b87460"/><g stroke="#806044" stroke-width="8"><path d="M48 158v-52m155 52V97m62 61v-52m87 52v-52"/></g><g fill="#82a87a"><circle cx="48" cy="93" r="27"/><circle cx="203" cy="82" r="31"/><circle cx="265" cy="93" r="25"/><circle cx="352" cy="93" r="27"/></g><rect x="405" y="91" width="48" height="70" fill="#d4b2d9"/><rect x="466" y="60" width="49" height="101" fill="#98bac4"/><rect x="530" y="105" width="64" height="56" fill="#e2b26d"/><g fill="#fff6de"><path d="M416 105h11v13h-11zm0 24h11v13h-11zm63-53h12v14h-12zm0 25h12v14h-12zm0 25h12v14h-12zm64-9h12v14h-12z"/></g></svg><figcaption class="small muted">Ilustração criada para comparar mudanças e permanências.</figcaption></figure>`;}
function renderQuestion(){const {s,q}=current(),r=s.responses[q.id],value=s.values[q.id];view(`<div class="narrow">${back()}<div class="panel"><div class="row between"><span class="tag">${esc(s.title)}</span><span class="small muted">Desafio ${s.index+1} de ${s.ids.length}</span></div><div class="track" style="margin-top:18px"><span style="width:${s.index/s.ids.length*100}%"></span></div><h1 class="question-title" id="question-text">${esc(q.prompt)}</h1>${q.visual?diagram(q.visual):''}${q.type==='multi'?'<p class="small muted">Marque todas as respostas corretas e depois confira.</p>':''}<div id="answer-area">${questionInputs(q,value,!!r,s)}</div><div class="answer-actions"><button class="primary" data-action="submit-answer" ${r?'hidden':''}>${s.mode==='sim'?'Registrar resposta':'Conferir resposta'}</button></div><div id="feedback" aria-live="polite">${r?feedbackMarkup(s,q,r):''}</div>${r?`<button style="margin-top:18px" class="primary" data-action="next">${s.index===s.ids.length-1?'Ver resultado':'Próximo desafio'}</button>`:''}</div><details><summary>Consultar os conceitos da missão</summary>${s.mode==='sim'?'<p>Guarde a consulta para depois do simulado. Você pode sair para o mapa se quiser estudar primeiro.</p>':`<p>${DATA.missions.find(m=>m.questions.some(x=>x.id===q.id)).facts.map(([t,d])=>`<b>${esc(t)}:</b> ${esc(d)}`).join('</p><p>')}</p>`}</details></div>`);}
function questionInputs(q,value,locked,s){if(q.type==='single'||q.type==='multi')return `<div class="choices" role="group" aria-labelledby="question-text">${s.optionOrders[q.id].map((v,i)=>{const on=q.type==='multi'?value?.includes(v):value===v;return `<button class="choice ${on?'selected':''}" data-action="choose" data-option="${i}" aria-pressed="${!!on}" ${locked?'disabled':''}><span class="marker" aria-hidden="true">${on?'✓':String.fromCharCode(65+i)}</span><span>${esc(v)}</span></button>`}).join('')}</div>`;if(q.type==='fill')return `<label class="label" for="fill-answer">Sua resposta</label><input id="fill-answer" type="text" autocomplete="off" spellcheck="false" maxlength="60" value="${esc(value||'')}" ${locked?'disabled':''}><p class="small muted" style="margin-top:7px">Pode escrever com ou sem acentos.</p>`;return `<p class="small muted">Use as setas para colocar as etapas na ordem. Depois confira.</p><ol class="order-list">${value.map((v,i)=>`<li class="order-item"><b>${i+1}.</b><span class="order-label">${esc(v)}</span><div class="row"><button data-action="move" data-i="${i}" data-dir="-1" aria-label="Subir etapa ${i+1}" ${locked||i===0?'disabled':''}>↑</button><button data-action="move" data-i="${i}" data-dir="1" aria-label="Descer etapa ${i+1}" ${locked||i===value.length-1?'disabled':''}>↓</button></div></li>`).join('')}</ol>`;}
function feedbackMarkup(s,q,r){if(s.mode==='sim'&&!s.finalized)return '<div class="note">Resposta registrada. A explicação aparece no resultado final.</div>';return `<div class="feedback ${r.ok?'':'retry'}"><h3>${r.ok?'✓ Boa descoberta!':'↻ Vamos descobrir juntos!'}</h3><p><strong>${q.type==='order'?'Sequência':'Resposta'}:</strong> ${esc(answerText(q))}</p><p>${esc(q.explain)}</p><div class="source">${source(q)}</div></div>`;}
function choose(i){const {s,q}=current();if(s.responses[q.id])return;const v=s.optionOrders[q.id][i];if(q.type==='multi'){const vals=s.values[q.id]||[];s.values[q.id]=vals.includes(v)?vals.filter(x=>x!==v):[...vals,v];}else s.values[q.id]=v;save();const area=document.getElementById('answer-area');area.innerHTML=questionInputs(q,s.values[q.id],false,s);area.querySelector(`[data-option="${i}"]`).focus({preventScroll:true});document.getElementById('feedback').textContent='';}
function move(i,dir){const {s,q}=current();if(s.responses[q.id])return;const a=s.values[q.id],j=i+dir;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];save();document.getElementById('answer-area').innerHTML=questionInputs(q,a,false,s);document.querySelector(`[data-action="move"][data-i="${j}"][data-dir="${-dir}"]`)?.focus({preventScroll:true});}
function submitAnswer(){const {s,q}=current();if(s.responses[q.id])return;const v=s.values[q.id];if(v===undefined||v===null||(typeof v==='string'&&!v.trim())||(Array.isArray(v)&&v.length===0)){document.getElementById('feedback').textContent=q.type==='fill'?'Escreva uma resposta antes de conferir.':'Escolha uma resposta antes de conferir.';return;}const ok=grade(q,v);s.responses[q.id]={value:Array.isArray(v)?[...v]:v,ok};if(s.mode!=='sim')record(q.id,ok);save();renderQuestion();document.querySelector('[data-action="next"]').focus({preventScroll:true});}
function nextQuestion(){const {s,q}=current();if(!s.responses[q.id])return;if(s.index<s.ids.length-1){s.index++;save();renderQuestion();}else finishSession();}
function finishSession(){const s=profile().session;if(!s.finalized){if(s.mode==='sim')for(const id of s.ids)record(id,s.responses[id].ok);s.finalized=true;save();}const right=s.ids.filter(id=>s.responses[id].ok).length;view(`<div class="narrow">${back()}<div class="panel tinted"><span class="eyebrow">${s.mode==='sim'?'Simulado concluído':'Rodada explorada'}</span><h1 style="margin-top:12px">Você conectou ideias!</h1><div class="result-score">${right} de ${s.ids.length}</div><p>respostas certas nesta rodada.</p><p>${right===s.ids.length?'Boa investigação! Agora tente explicar uma descoberta com as suas palavras.':'As dúvidas são pistas para o próximo passo. Leia as explicações e volte para praticar.'}</p>${s.mission!==null&&missionDone(s.mission)?'<p><span class="tag green">🏅 Selo desta missão conquistado!</span></p>':''}<div class="row"><button class="primary" data-action="review">Rever dúvidas · ${pending().length}</button><button data-action="notebook" data-i="${s.mission??0}">Explicar no caderno</button></div><p class="small" style="margin:18px 0 0">Vale uma pausa: levante, alongue o corpo e descanse os olhos. XP e acertos não são uma previsão da nota da prova.</p></div>${s.mission!==null?`<div class="note"><strong>Agora, sem olhar!</strong><p>${esc(DATA.missions[s.mission].reflect)}</p></div>`:''}<h2>As descobertas da rodada</h2><div class="results-list">${s.ids.map(id=>{const q=QUESTIONS.find(q=>q.id===id),r=s.responses[id];return `<article><span class="tag ${r.ok?'green':'gold'}">${r.ok?'✓ Acertou':'↻ Para revisar'}</span><h3 style="margin-top:12px">${esc(q.prompt)}</h3><p class="small muted">Sua resposta: ${esc(Array.isArray(r.value)?r.value.join(' → '):r.value)}</p><p><b>Resposta:</b> ${esc(answerText(q))}</p><p>${esc(q.explain)}</p><span class="small muted">${source(q)}</span></article>`}).join('')}</div></div>`);}
function review(){const qs=pending();if(!qs.length)return view(`<div class="narrow">${back()}<div class="panel"><h1>💡 Nenhuma dúvida pendente</h1><p>Quando você errar uma questão, ela aparecerá aqui. Depois de acertar na revisão, ela sai desta lista.</p><button class="primary" data-action="home">Escolher uma missão</button></div></div>`);startSession(qs.map(q=>q.id),'Revisão das dúvidas','review');}
function simIntro(){view(`<div class="narrow">${back()}<div class="panel"><span class="eyebrow">Uma preparação tranquila</span><h1 style="margin-top:12px">🎒 Simulado da expedição</h1><p>São <b>12 perguntas: duas de cada missão</b>. Leia com calma e registre sua resposta. Você verá os acertos e todas as explicações no final.</p><div class="note"><strong>Sem cronômetro, sem pressa.</strong><p>Tente responder sem consultar. Pode sair para o mapa e continuar depois no mesmo navegador.</p></div>${profile().session&&!profile().session.finalized?'<p class="small muted">Começar um simulado substitui a rodada em andamento. Acertos e pontos anteriores continuam salvos.</p>':''}<button class="primary" data-action="start-sim">Começar simulado</button></div></div>`);}
const searchCache={};let activeSearch=0,firstCell=null,activeCross=0,activeNotebook=0;
function makeSearch(k){if(searchCache[k])return searchCache[k];let seed=9487+k*5323;const random=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296;};const grid=Array(144).fill(''),paths={};for(const {word} of [...DATA.searches[k].words].sort((a,b)=>b.word.length-a.word.length)){const w=wordNorm(word);let placed=false;for(let t=0;t<4000;t++){const [dr,dc]=[[0,1],[1,0],[1,1]][Math.floor(random()*3)],r=Math.floor(random()*12),c=Math.floor(random()*12);if(r+dr*(w.length-1)>11||c+dc*(w.length-1)>11)continue;const p=Array.from(w,(_,i)=>(r+dr*i)*12+c+dc*i);if(!p.every((j,i)=>!grid[j]||grid[j]===w[i]))continue;p.forEach((j,i)=>grid[j]=w[i]);paths[w]=p;placed=true;break;}if(!placed)throw Error('Não foi possível montar o caça-palavras.');}for(let i=0;i<144;i++)if(!grid[i])grid[i]='ABCDEFGHIJKLMNOPQRSTUVWXYZ'[Math.floor(random()*26)];return searchCache[k]={grid,paths};}
function searchView(k){activeSearch=k;firstCell=null;const p=DATA.searches[k],{grid}=makeSearch(k);view(`<div class="narrow">${back()}<div class="panel"><span class="eyebrow">Encontre a palavra, descubra a ideia</span><h1 class="question-title">🔎 Caça-palavras</h1><div class="tabs">${DATA.searches.map((p,i)=>`<button class="${i===k?'active':''}" data-action="search" data-i="${i}" aria-pressed="${i===k}">${p.title}</button>`).join('')}</div><p>Toque na <b>primeira</b> e na <b>última letra</b> da palavra. Vale na horizontal →, vertical ↓ ou diagonal ↘. Pode selecionar ao contrário também!</p><div class="puzzle-layout"><div class="letter-grid" role="group" aria-label="Tabuleiro de letras">${grid.map((c,i)=>`<button class="cell" data-action="cell" data-cell="${i}" aria-label="${c}, linha ${Math.floor(i/12)+1}, coluna ${i%12+1}">${c}</button>`).join('')}</div><div><div class="words">${p.words.map(w=>`<span class="word" data-word="${w.word}">${w.word}</span>`).join('')}</div><p class="small muted">Aqui as palavras ficam sem acentos: EROSAO = erosão, AGUA = água.</p><p id="word-count" class="small"></p><div class="row"><button data-action="hint-search">Uma pista</button><button data-action="cancel-search">Cancelar seleção</button></div></div></div><div id="puzzle-feedback" class="note" aria-live="polite">Escolha uma palavra da lista e procure suas letras.</div><p class="small muted">Conceitos das páginas ${p.pages}. Cada palavra descoberta vale 10 XP uma única vez.</p></div></div>`);paintSearch();}
function paintSearch(){const {paths}=makeSearch(activeSearch),found=new Set();let count=0;for(const w of DATA.searches[activeSearch].words){const yes=!!profile().awards[`s:${activeSearch}:${w.word}`];if(yes){paths[w.word].forEach(i=>found.add(i));count++;}document.querySelector(`[data-word="${w.word}"]`).classList.toggle('done',yes);}document.querySelectorAll('[data-cell]').forEach(el=>{const i=Number(el.dataset.cell);el.classList.toggle('found',found.has(i));el.classList.toggle('start',i===firstCell);el.setAttribute('aria-pressed',String(i===firstCell));});document.getElementById('word-count').textContent=`${count} de 6 palavras encontradas${count===6?' · Tabuleiro completo! ⭐':''}`;}
function selectCell(i){const notice=document.getElementById('puzzle-feedback');if(firstCell===null){firstCell=i;notice.textContent='Primeira letra marcada. Agora escolha a última.';paintSearch();return;}const a=firstCell,b=i;firstCell=null;const r1=Math.floor(a/12),c1=a%12,r2=Math.floor(b/12),c2=b%12;const dr=Math.sign(r2-r1),dc=Math.sign(c2-c1);if(a===b||!(r1===r2||c1===c2||Math.abs(r2-r1)===Math.abs(c2-c1))){notice.textContent='Procure uma linha reta: horizontal, vertical ou diagonal. Tente de novo!';paintSearch();return;}const length=Math.max(Math.abs(r2-r1),Math.abs(c2-c1))+1,{grid}=makeSearch(activeSearch);const path=Array.from({length},(_,j)=>(r1+dr*j)*12+c1+dc*j),text=path.map(j=>grid[j]).join('');const w=DATA.searches[activeSearch].words.find(w=>w.word===text||w.word===[...text].reverse().join(''));if(w){const fresh=award(`s:${activeSearch}:${w.word}`);notice.innerHTML=`<strong>${fresh?'✓ Descoberta!':'✓ Você reencontrou!'} ${esc(w.word)}</strong><p>${esc(w.concept)}</p>`;if(fresh)toast('+10 XP · Uma palavra, uma ideia!');}else notice.textContent='Essa sequência ainda não forma uma palavra da lista. Observe as letras e tente outra vez.';paintSearch();}
function hintSearch(){const w=DATA.searches[activeSearch].words.find(w=>!profile().awards[`s:${activeSearch}:${w.word}`]);if(!w){document.getElementById('puzzle-feedback').textContent='Você já encontrou todas! Escolha outro tabuleiro.';return;}firstCell=makeSearch(activeSearch).paths[w.word][0];paintSearch();document.getElementById('puzzle-feedback').textContent=`Pista: marquei o começo de ${w.word}. ${w.concept} Agora procure a última letra.`;}
function makeCrossword(k){const entries=DATA.crosswords[k].entries.map(e=>({...e})),starts=[...new Set(entries.map(e=>`${e.row},${e.col}`))].sort((a,b)=>{const [ar,ac]=a.split(',').map(Number),[br,bc]=b.split(',').map(Number);return ar-br||ac-bc;});entries.forEach(e=>e.number=starts.indexOf(`${e.row},${e.col}`)+1);return {entries,rows:Math.max(...entries.map(e=>e.row+(e.dir==='down'?e.word.length:1))),cols:Math.max(...entries.map(e=>e.col+(e.dir==='across'?e.word.length:1)))};}
function crossView(k){activeCross=k;const p=DATA.crosswords[k],layout=makeCrossword(k);view(`<div class="narrow">${back()}<div class="panel"><span class="eyebrow">As ideias se cruzam</span><h1 class="question-title">🧩 Cruzadinhas</h1><div class="tabs">${DATA.crosswords.map((p,i)=>`<button class="${i===k?'active':''}" data-action="cross" data-i="${i}" aria-pressed="${i===k}">${p.title}</button>`).join('')}</div><p>Leia cada pista e escreva a palavra no campo abaixo dela. Suas letras aparecem no desenho. As palavras compartilham letras nos cruzamentos!</p><p class="small muted">Sem espaços e sem acentos. Cada palavra certa vale 10 XP uma vez. Uma letra laranja indica que duas respostas discordam no cruzamento.</p><div class="puzzle-layout"><div id="cross-drawing"></div><div>${p.words.map((w,i)=>{const e=layout.entries[i];return `<div class="clue"><label for="cross-${i}"><b>${e.number}. ${e.dir==='across'?'→ Horizontal':'↓ Vertical'}</b> · ${esc(w.clue)} <span class="muted">(${w.word.length} letras)</span></label><input type="text" data-cross-input="${i}" id="cross-${i}" value="${esc(profile().crossDrafts[`${k}:${i}`]||'')}" maxlength="${w.word.length+5}" autocomplete="off" spellcheck="false"><div class="answer-note" id="cross-note-${i}"></div></div>`}).join('')}<button class="primary" data-action="check-cross">Conferir palavras</button></div></div><div id="cross-feedback" class="note" aria-live="polite">Uma pista de cada vez. Use os cruzamentos para pensar!</div><p class="small muted">Base: páginas ${p.pages}.</p></div></div>`);paintCross();}
function paintCross(){const {entries,rows,cols}=makeCrossword(activeCross),cells={};entries.forEach((e,j)=>{const value=wordNorm(profile().crossDrafts[`${activeCross}:${j}`]||'');for(let i=0;i<e.word.length;i++){const key=`${e.row+(e.dir==='down'?i:0)},${e.col+(e.dir==='across'?i:0)}`;cells[key]??={letters:[],number:null};if(i===0)cells[key].number=e.number;if(value[i])cells[key].letters.push(value[i]);}});document.getElementById('cross-drawing').innerHTML=`<div class="cross-grid" style="grid-template-columns:repeat(${cols},minmax(0,1fr))" role="img" aria-label="Cruzadinha com ${entries.length} palavras que se cruzam. Digite usando os campos das pistas.">${Array.from({length:rows*cols},(_,i)=>{const c=cells[`${Math.floor(i/cols)},${i%cols}`];return c?`<div class="cross-cell ${new Set(c.letters).size>1?'conflict':''}">${c.number?`<small>${c.number}</small>`:''}${esc(c.letters[0]||'')}</div>`:'<div class="cross-cell blank"></div>';}).join('')}</div>`;}
function checkCross(){const p=DATA.crosswords[activeCross];let count=0;const found=[];p.words.forEach((w,i)=>{const value=wordNorm(profile().crossDrafts[`${activeCross}:${i}`]||''),ok=value===w.word;const note=document.getElementById(`cross-note-${i}`);if(ok){count++;award(`c:${activeCross}:${w.word}`);note.textContent='✓ '+w.concept;found.push(w.word);}else note.textContent=value?'↻ Ainda não. Releia a pista e confira as letras que se cruzam.':'Escreva sua ideia para conferir.';});document.getElementById('cross-feedback').textContent=`${count} de 5 palavras corretas nesta conferência. ${count===5?'Cruzadinha completa! Agora explique uma dessas palavras a alguém.': 'Continue investigando as pistas.'}`;paintCross();}
function notebook(i=0){activeNotebook=i;const m=DATA.missions[i];view(`<div class="narrow">${back()}<div class="panel"><span class="eyebrow">Você também é professor por um minuto</span><h1 class="question-title">📓 Caderno de descobertas</h1><div class="tabs">${DATA.missions.map((m,j)=>`<button data-action="notebook" data-i="${j}" class="${i===j?'active':''}" aria-pressed="${i===j}">${j+1}. ${m.title}</button>`).join('')}</div><p class="reflect-prompt">${esc(m.reflect)}</p><label class="label" for="reflection">Minha explicação</label><textarea id="reflection" maxlength="3000" placeholder="Eu descobri que... porque...">${esc(profile().drafts[i]||'')}</textarea><p id="draft-status" class="save-state">${storageOK?'Salvo automaticamente neste navegador.':'Rascunho disponível apenas nesta sessão.'}</p><details><summary>Conferir minha explicação com um adulto</summary><ul class="checklist"><li>Eu expliquei a ideia, em vez de apenas dar um nome?</li><li>Dei um exemplo que combina com o assunto?</li><li>Contei uma causa e uma consequência, quando a pergunta pede?</li><li>Usei o livro para conferir o que ainda me deixou em dúvida?</li></ul><p class="small muted">Esta atividade não recebe correção automática nem XP. Uma resposta pode estar escrita de muitos jeitos. Converse sobre o sentido dela.</p></details><div class="note"><strong>Uma pista para sua conversa</strong><p>${esc(m.facts[0][1])}</p></div></div></div>`);}
function lab(cover='garden'){const states={garden:{title:'Jardim com vegetação',icon:'🌱',color:'#92b78b',water:'Parte da chuva pode entrar no solo.',why:'A superfície permite infiltração. A vegetação também ajuda a proteger a terra. Nem toda a água é absorvida: isso depende da chuva e das condições do solo.'},paving:{title:'Chão coberto de cimento',icon:'🏘️',color:'#aaa9a2',water:'Mais água tende a escorrer pela superfície.',why:'A cobertura impermeável dificulta a passagem de água para o solo. Áreas verdes e pisos permeáveis ajudam a manter espaços de infiltração.'},bare:{title:'Encosta sem vegetação',icon:'⛰️',color:'#c69b78',water:'A chuva pode carregar terra encosta abaixo.',why:'O solo exposto fica mais sujeito à erosão. Em encostas, o encharcamento também pode favorecer deslizamentos. Preservar vegetação ajuda a reduzir riscos.'}};const s=states[cover];view(`<div class="narrow">${back()}<div class="panel"><span class="eyebrow">Laboratório de ideias · páginas 93–94</span><h1 class="question-title">🌧️ Para onde vai a chuva?</h1><p>Escolha uma superfície e compare. O desenho representa uma ideia; não é uma medição.</p><div class="tabs">${Object.entries(states).map(([k,v])=>`<button data-action="lab" data-cover="${k}" class="${k===cover?'active':''}" aria-pressed="${k===cover}">${v.icon} ${v.title}</button>`).join('')}</div><svg class="diagram" viewBox="0 0 600 250" role="img" aria-label="${esc(s.title+'. '+s.water)}"><rect width="600" height="250" fill="#e9f2f5"/><text x="290" y="60" text-anchor="middle" font-size="49">🌧️</text><path d="M140 77l-8 27m75-27-8 27m75-27-8 27m75-27-8 27m75-27-8 27" stroke="#6aabc4" stroke-width="4" stroke-linecap="round"/><path d="${cover==='bare'?'M0 123L600 213V250H0Z':'M0 157H600V250H0Z'}" fill="${s.color}"/>${cover==='garden'?'<text x="112" y="151" font-size="35">🌱</text><text x="417" y="151" font-size="35">🌱</text><path d="M220 145v63m-10-12 10 12 10-12m100-51v63m-10-12 10 12 10-12" stroke="#307898" stroke-width="5" fill="none"/>':`<path d="${cover==='bare'?'M210 144l230 36-18-18m18 18-25 8':'M180 142h270l-17-13m17 13-17 13'}" stroke="#307898" stroke-width="5" fill="none"/>`}</svg><div class="note" aria-live="polite"><strong>${s.water}</strong><p>${s.why}</p></div><p><b>Conte para alguém:</b> o que muda no caminho da chuva quando trocamos um jardim por cimento?</p><p class="small muted">Exploração livre, sem pontos. Observe o que acontece e use a ideia nas missões.</p></div></div>`);}
function guide(){view(`<div class="narrow">${back()}<div class="panel"><h1 class="question-title">Guia da família</h1><p>Proposta para o 3º ano: uma missão por rodada, com previsão de <b>15–20 minutos</b>, ajustada ao ritmo da criança. Comece pelos conceitos, faça os desafios e termine com uma explicação oral ou escrita. Depois, vale uma pausa.</p><h2>O que tem nesta expedição</h2><p>72 questões em seis missões; três caça-palavras com seis termos cada; três cruzadinhas com cinco pistas cada; laboratório da chuva; caderno de descobertas; revisão de dúvidas; simulado de 12 questões retiradas do banco, duas por missão.</p><h2>Base do conteúdo</h2><p>Comunicado de avaliação em 2/10 e 27 páginas fotografadas (IMG_8499 a IMG_8526): <b>82–91, 93–103 e 164–169</b>. Temas: trabalho e paisagens; solo, uso e degradação; água, importância e conservação. As perguntas e ilustrações são originais. As respostas manuscritas não foram tratadas como gabarito.</p><p class="small">O mapa do Bairro Curioso e a comparação de paisagens são ilustrações didáticas fictícias. Os percentuais do gráfico reproduzem o material da página 103, com fonte de 2013; não representam dados atuais. As páginas 92 e anotações de caderno não fornecidas não foram acrescentadas.</p><h2>Aprender com a tentativa</h2><p>Peça que a criança explique o porquê da resposta. As alternativas misturam conceitos próximos para incentivar a leitura. Erros recebem explicação e vão para “Rever dúvidas”; um acerto posterior os retira da lista. Acertar depois de revisar faz parte da aprendizagem.</p><h2>Como os pontos funcionam</h2><p>Cada questão, palavra do caça-palavras ou pista da cruzadinha acertada rende <b>10 XP uma única vez</b>. Erros não tiram pontos. Os seis selos são concedidos quando todas as 12 questões de cada missão já foram acertadas. Progresso das questões e dos jogos aparece separado. O laboratório e o caderno são livres e não dão XP. A pontuação não é nota escolar nem previsão de desempenho na prova.</p><h2>Perfis e progresso</h2><p>Nome ou apelido, respostas, rodada e rascunhos ficam neste navegador, quando o armazenamento está disponível. Não há envio de dados nem cadastro. Use apelidos distintos para crianças com o mesmo nome. Use uma aba de estudo por vez: alterações simultâneas em várias abas não são mescladas.</p><p>Trocar de navegador, aparelho ou endereço do arquivo pode separar o progresso. Limpar os dados do navegador pode apagá-lo. Se não for possível salvar, um aviso fica visível e a criança ainda pode jogar durante a sessão.</p><details open><summary>Apagar o perfil de ${esc(profile().name)}</summary><p>A exclusão remove apenas este perfil, suas respostas, pontos e rascunhos deste navegador.</p><button class="danger" data-action="reset-ask">Apagar este perfil…</button><div id="reset-confirm" hidden class="note warm"><p>Quer apagar este perfil e começar do zero? Os outros exploradores serão mantidos.</p><div class="row"><button class="danger" data-action="reset-confirm">Sim, apagar meu perfil</button><button data-action="reset-cancel">Cancelar</button></div></div></details></div></div>`);}
document.addEventListener('submit',e=>{if(e.target.id==='name-form'){e.preventDefault();enter(document.getElementById('child-name').value);}});
document.addEventListener('input',e=>{if(!profile())return;const el=e.target;if(el.id==='fill-answer'){const {s,q}=current();s.values[q.id]=el.value;save();}if(el.hasAttribute('data-cross-input')){profile().crossDrafts[`${activeCross}:${el.dataset.crossInput}`]=el.value;save();paintCross();const n=document.getElementById(`cross-note-${el.dataset.crossInput}`);if(n)n.textContent='';}if(el.id==='reflection'){profile().drafts[activeNotebook]=el.value;save();document.getElementById('draft-status').textContent=storageOK?'Salvo neste navegador.':'Disponível apenas nesta sessão.';}});
document.addEventListener('click',e=>{const b=e.target.closest('button[data-action]');if(!b||b.disabled)return;const a=b.dataset.action,i=Number(b.dataset.i||0);if(a==='resume-profile'){store.active=b.dataset.id;save();home();return;}if(a==='switch')return welcome();if(!profile())return;
switch(a){case'home':home();break;case'guide':guide();break;case'lesson':lesson(i);break;case'start-mission':startSession(DATA.missions[i].questions.map(q=>q.id),DATA.missions[i].title,'practice',i);break;case'continue':renderQuestion();break;case'choose':choose(Number(b.dataset.option));break;case'move':move(i,Number(b.dataset.dir));break;case'submit-answer':submitAnswer();break;case'next':nextQuestion();break;case'review':review();break;case'sim-intro':simIntro();break;case'start-sim':startSession(DATA.missions.flatMap(m=>shuffled(m.questions.filter(q=>q.type==='single')).slice(0,2).map(q=>q.id)),'Simulado','sim');break;case'search':searchView(i);break;case'cell':selectCell(Number(b.dataset.cell));break;case'hint-search':hintSearch();break;case'cancel-search':firstCell=null;paintSearch();document.getElementById('puzzle-feedback').textContent='Seleção cancelada. Escolha uma primeira letra.';break;case'cross':crossView(i);break;case'check-cross':checkCross();break;case'notebook':notebook(i);break;case'lab':lab(b.dataset.cover||'garden');break;case'reset-ask':document.getElementById('reset-confirm').hidden=false;document.querySelector('[data-action="reset-confirm"]').focus();break;case'reset-cancel':document.getElementById('reset-confirm').hidden=true;document.querySelector('[data-action="reset-ask"]').focus();break;case'reset-confirm':store.profiles=store.profiles.filter(p=>p.id!==store.active);store.active=null;save();welcome();break;}});
if(profile())home();else welcome();

</script>
